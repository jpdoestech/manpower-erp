name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows-launchers:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s scripts/tests -p "test_windows_launchers.py" -v
  windows-sqlite:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install uv==0.13.7
      - run: uv python install 3.13.18
      - run: uv sync --locked --managed-python
      - run: uv run --locked mypy ../scripts
      - run: uv run --locked pytest -q -m "not integration"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Verify real native Windows BAT setup and startup
        env:
          ERP_NATIVE_SMOKE: "1"
        run: uv run --locked python -m unittest discover -s ../scripts/tests -p "test_*launchers.py" -v
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: manpower
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: manpower_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U manpower -d manpower_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://manpower:ci-only-password@127.0.0.1:5432/manpower_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install uv==0.13.7
      - run: uv python install 3.13.18
      - run: uv sync --locked --managed-python
      - run: uv run --locked ruff format --config pyproject.toml --check . ../scripts
      - run: uv run --locked ruff check --config pyproject.toml . ../scripts
      - run: uv run --locked mypy app tests alembic ../scripts
      - run: uv run --locked pytest -q -m "not integration"
      - run: uv run --locked pytest -q -m integration
      - name: Verify migration CLI on clean service database
        run: |
          uv run --locked alembic upgrade head
          uv run --locked alembic upgrade head
          uv run --locked alembic check
          uv run --locked alembic downgrade base
          uv run --locked alembic upgrade head
          uv run --locked alembic check
      - run: uv run --locked pip-audit
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=low
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Boot clean local stack and verify persistence
        shell: bash
        run: |
          set -euo pipefail
          printf 'POSTGRES_PASSWORD=%s\n' "p@ss/$(openssl rand -hex 24)%#" > .env
          printf 'AUTH_ORIGIN=http://127.0.0.1:5173\nAUTH_COOKIE_SECURE=false\n' >> .env
          docker compose config --quiet
          docker compose up --build --wait --wait-timeout 180
          export ERP_CI_PASSWORD=$(openssl rand -hex 24)
          docker compose exec -T -e ERP_CI_PASSWORD api .venv/bin/python -c 'import os; from sqlalchemy.orm import Session; from app.database import create_database_engine; from app.identity.service import provision_user; engine=create_database_engine(); db=Session(engine); provision_user(db, "ci-user", os.environ["ERP_CI_PASSWORD"]); db.close(); engine.dispose()'
          python backend/tests/smoke_identity.py
          curl --fail http://127.0.0.1:5173/ | grep -q '<title>Manpower ERP</title>'
          python -c 'import json, urllib.request; assert json.load(urllib.request.urlopen("http://127.0.0.1:5173/api/bootstrap")) == {"name": "Manpower ERP", "stage": "bootstrap"}'
          python -c 'import json, urllib.request; assert json.load(urllib.request.urlopen("http://127.0.0.1:8000/api/health/live")) == {"status": "live"}; assert json.load(urllib.request.urlopen("http://127.0.0.1:5173/api/health/ready")) == {"status": "ready"}'
          docker compose stop db
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/health/live)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/health/ready)" = 503
          docker compose start db
          curl --fail --retry 15 --retry-all-errors --retry-delay 2 http://127.0.0.1:8000/api/health/ready
          docker compose exec -T api .venv/bin/alembic check
          before=$(docker compose exec -T db psql -U manpower -d manpower -Atc 'SELECT system_identifier FROM pg_control_system()')
          docker compose down
          docker compose up --wait --wait-timeout 180
          after=$(docker compose exec -T db psql -U manpower -d manpower -Atc 'SELECT system_identifier FROM pg_control_system()')
          test "$before" = "$after"
          python backend/tests/smoke_identity.py
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes
