name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: manpower
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: manpower_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U manpower -d manpower_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://manpower:ci-only-password@127.0.0.1:5432/manpower_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install uv==0.13.7
      - run: uv sync --locked
      - run: uv run --locked ruff format --check .
      - run: uv run --locked ruff check .
      - run: uv run --locked mypy app tests
      - run: uv run --locked pytest -q -m "not integration"
      - run: uv run --locked pytest -q -m integration
      - run: uv run --locked pip-audit
      # No schema in P0-01. Migration up/down becomes mandatory with P0-02.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=low
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Boot clean local stack and verify persistence
        shell: bash
        run: |
          set -euo pipefail
          printf 'POSTGRES_PASSWORD=%s\n' "$(openssl rand -hex 24)" > .env
          docker compose config --quiet
          docker compose up --build --wait --wait-timeout 180
          curl --fail http://127.0.0.1:5173/ | grep -q '<title>Manpower ERP</title>'
          python -c 'import json, urllib.request; assert json.load(urllib.request.urlopen("http://127.0.0.1:5173/api/bootstrap")) == {"name": "Manpower ERP", "stage": "bootstrap"}'
          before=$(docker compose exec -T db psql -U manpower -d manpower -Atc 'SELECT system_identifier FROM pg_control_system()')
          docker compose down
          docker compose up --wait --wait-timeout 180
          after=$(docker compose exec -T db psql -U manpower -d manpower -Atc 'SELECT system_identifier FROM pg_control_system()')
          test "$before" = "$after"
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes
